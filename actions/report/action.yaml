# downloads the json report artifact from the run action, renders it as
# markdown, and writes it to the job summary.
name: pats report
description: Render a pats-action json report as markdown

inputs:
  artifact-name:
    description: artifact holding pats-report.json
    default: pats-report

outputs:
  markdown:
    description: absolute path of the rendered markdown
    value: ${{ steps.render.outputs.markdown }}
  overall:
    description: overall score (empty if not scored)
    value: ${{ steps.render.outputs.overall }}

runs:
  using: composite
  steps:
    - name: Download json report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/pats-report-in

    - name: Render
      id: render
      shell: bash
      run: >-
        python3 "$GITHUB_ACTION_PATH/render_report.py"
        "$RUNNER_TEMP/pats-report-in/pats-report.json"
        -o "$RUNNER_TEMP/pats-report.md" --step-summary
