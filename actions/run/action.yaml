# installs the pats snap, runs `pats init` + `pats run` + `pats score` in an
# already checked-out repo, and uploads a json report (see
# README.md#report-json) as an artifact.
#
# harness credentials come from the step's env, under the names pats reads
# (CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY, OPENROUTER_API_KEY,
# COPILOT_GITHUB_TOKEN).
# needs a linux runner with docker and snapd. the snap is strictly confined: the
# project must sit under the home and not in a hidden dir (any checkout under
# GITHUB_WORKSPACE is fine), and every task/scorer script needs a step-sandbox.
name: pats run
description: Install pats, run + score its suites, upload the json report

inputs:
  pats-channel:
    description: snap channel to install pats from (e.g. latest/candidate, latest/stable). the pats version also pins the sandbox images
    default: latest/stable
  working-directory:
    description: dir holding pats.yaml
    default: "."
  run-args:
    description: extra args for `pats run`, e.g. "-S smoke -j -1" (-S selects suites)
    default: ""
  score-args:
    description: extra args for `pats score`, e.g. "-S smoke -j -1" (-S suites, -s scorers)
    default: ""
  artifact-name:
    description: name of the uploaded json report artifact
    default: pats-report

outputs:
  report:
    description: absolute path of the json report
    value: ${{ steps.collect.outputs.report }}
  overall:
    description: overall score (empty if not scored)
    value: ${{ steps.collect.outputs.overall }}
  run-dir:
    description: absolute path of the run dir, for uploading logs/outputs yourself
    value: ${{ steps.collect.outputs.run-dir }}

runs:
  using: composite
  steps:
    - name: Install pats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PATS_CHANNEL: ${{ inputs.pats-channel }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: pats init + run + score
      id: pats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN_ARGS: ${{ inputs.run-args }}
        SCORE_ARGS: ${{ inputs.score-args }}
      run: bash "$GITHUB_ACTION_PATH/pats.sh"

    - name: Collect json report
      id: collect
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN_RC: ${{ steps.pats.outputs.run-exit-code }}
        SCORE_RC: ${{ steps.pats.outputs.score-exit-code }}
      run: bash "$GITHUB_ACTION_PATH/collect.sh"

    - name: Upload json report
      if: always() && steps.collect.outputs.report != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.collect.outputs.report }}

    - name: Fail on pats errors
      shell: bash
      env:
        RUN_RC: ${{ steps.pats.outputs.run-exit-code }}
        SCORE_RC: ${{ steps.pats.outputs.score-exit-code }}
      run: |
        if [[ "$RUN_RC" != "0" || "$SCORE_RC" != "0" ]]; then
          echo "::error::pats run exited ${RUN_RC:-n/a}, pats score exited ${SCORE_RC:-n/a}"
          exit 1
        fi
